specVersion: v0.1.0
package:
  name: "substreams_template"
  version: v0.3.1

imports:
  database_change: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v1.2.1/substreams-database-change-v1.2.1.spkg
  sink_sql: https://github.com/streamingfast/substreams-sink-sql/releases/download/protodefs-v1.0.3/substreams-sink-sql-protodefs-v1.0.3.spkg

protobuf:
  files:
    - erc721.proto
  importPaths:
    - ./proto
  excludePaths:
    - ./google
    - ./sf/substreams

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:
  - name: map_transfers
    kind: map
    # Contract created at 12287507 but first meaningful block is at 12292922
    initialBlock: 12292922
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.erc721.v1.Transfers

  - name: store_transfers
    kind: store
    # Contract created at 12287507 but first meaningful block is at 12292922
    initialBlock: 12292922
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_transfers

  - name: db_out
    kind: map
    # Contract created at 12287507 but first meaningful block is at 12292922
    initialBlock: 12292922
    inputs:
      - source: sf.substreams.v1.Clock
      - map: map_transfers
      - store: store_transfers
        mode: deltas
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: mainnet

sink:
   module: db_out
   type: sf.substreams.sink.sql.v1.Service
   config:
      schema: "./schema.sql"